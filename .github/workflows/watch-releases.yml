name: Watch Lemonade releases
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watch-lemonade-releases
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        with:
          script: |
            const watch = require('./scripts/watch-releases.cjs');
            await watch({github, context, core});
